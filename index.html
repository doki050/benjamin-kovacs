<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6f6f4">
  <meta name="description" content="Kovács Benjámin Márk — links and published App Store apps.">
  <meta name="robots" content="index,follow">
  <meta property="og:title" content="Kovács Benjámin Márk">

  <title>Developer Site</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">

<body>
  <main class="page">
    <section class="intro" aria-labelledby="role">
      <div class="hero-copy">
        <h1 id="role">Software Engineer</h1>
        <p class="name">Kovács Benjámin Márk</p>
      </div>
      <nav class="profile-links" aria-label="Profiles">
        <a href="https://www.linkedin.com/in/kovacsbenjaminmark" target="_blank" rel="noopener noreferrer">
          <span>LinkedIn</span><span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a href="https://github.com/doki050" target="_blank" rel="noopener noreferrer">
          <span>GitHub</span><span class="arrow" aria-hidden="true">↗</span>
        </a>
      </nav>
    </section>

    <section class="apps" aria-labelledby="apps-title">
      <div class="section-heading">
        <p class="eyebrow">Published App Store apps</p>
        <h2 id="apps-title">Apps</h2>
      </div>

      <div class="app-grid">
        <article class="app-card">
          <a class="app-link" href="https://apps.apple.com/app/id6813370508" target="_blank" rel="noopener noreferrer" aria-label="Open CloneE on the App Store">
            <div class="icon-shell">
              <img src="https://raw.githubusercontent.com/doki050/clonee-privacy/main/assets/app-icon.png" alt="CloneE app icon" width="144" height="144" decoding="async">
            </div>
            <div class="app-copy">
              <div class="app-title-row">
                <h3>CloneE</h3><span class="arrow" aria-hidden="true">↗</span>
              </div>
              <p>Currently only available in the USA.</p>
            </div>

        <article class="app-card">
          <a class="app-link" href="https://apps.apple.com/app/id6815255650" target="_blank" rel="noopener noreferrer" aria-label="Open FoxLog on the App Store">
            <div class="icon-shell">
              <img src="assets/foxlog-icon.webp?v=2" alt="FoxLog app icon" width="144" height="144" decoding="async">
            </div>
            <div class="app-copy">
              <div class="app-title-row">
                <h3>FoxLog</h3><span class="arrow" aria-hidden="true">↗</span>
              </div>
              <p>Available worldwide.</p>
            </div>
